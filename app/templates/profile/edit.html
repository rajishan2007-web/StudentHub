{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Edit Profile</h2>

        <form method="POST">

            <input
                type="text"
                name="username"
                placeholder="Username"
                value="{{ current_user.username }}"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="Email address"
                value="{{ current_user.email }}"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="New password (leave blank to keep)"
            >

            <button type="submit">Save Changes</button>

        </form>

        <p>
            <a href="{{ url_for('profile.view_profile') }}">← Back to Profile</a>
        </p>

    </div>

</div>

{% endblock %}
