{% extends "base.html" %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Welcome back</h2>

        <form method="POST">

            <input
                type="email"
                name="email"
                placeholder="Email address"
                required
            >

            <input
                type="password"
                name="password"
                placeholder="Password"
                required
            >

            <button type="submit">Sign In</button>

        </form>

        <p>
            Don't have an account?
            <a href="{{ url_for('auth.signup') }}">Create one</a>
        </p>

    </div>

</div>

{% endblock %}
