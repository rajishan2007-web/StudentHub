{% extends "base.html" %}

{% block content %}

<div class="post-container">

    <h1>{{ post.title }}</h1>
    <p><small>By {{ post.author.username }} on {{ post.created_at.strftime('%d %b %Y') }}</small></p>

    <div class="post-content">
        {{ post.content }}
    </div>

    <div class="post-actions">
        <a href="{{ url_for('blog.list_posts') }}" class="btn secondary">Back to Blog</a>
        {% if current_user.is_authenticated and current_user.id == post.user_id %}
            <form method="POST" action="{{ url_for('blog.delete_post', post_id=post.id) }}" class="inline-form">
                <button type="submit" class="btn btn-danger" onclick="return confirm('Are you sure you want to delete this post?')">Delete Post</button>
            </form>
        {% endif %}
    </div>

</div>

{% endblock %}
